<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Test Registration</title>
</head>
<body>
<h1>Registration Form</h1>
<form id="registerForm">
    <input type="text" id="login" placeholder="Login" required><br>
    <input type="password" id="password" placeholder="Password" required><br>
    <input type="text" id="firstName" placeholder="First Name" required><br>
    <input type="text" id="lastName" placeholder="Last Name" required><br>
    <button type="submit">Register</button>
</form>

<div id="response" style="margin-top:20px; white-space: pre-wrap;"></div>

<script>
    const form = document.getElementById('registerForm');
    const responseDiv = document.getElementById('response');

    form.addEventListener('submit', async (e) => {
        e.preventDefault();

        const login = document.getElementById('login').value;
        const password = document.getElementById('password').value;
        const firstName = document.getElementById('firstName').value;
        const lastName = document.getElementById('lastName').value;

        try {
            const res = await fetch('http://localhost:8080/account/register', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json'
                },
                credentials: 'include',
                body: JSON.stringify({ login, password, firstName, lastName })
            });

            const data = await res.json();
            responseDiv.innerText = JSON.stringify(data, null, 2);
        } catch (err) {
            responseDiv.innerText = 'Error: ' + err;
        }
    });
</script>
</body>
</html>
